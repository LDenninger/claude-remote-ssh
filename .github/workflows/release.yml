name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Tag matches version and changelog
        run: python .github/scripts/release_check.py --tag "$GITHUB_REF_NAME" --notes notes.md
      - name: Build plugin archive
        run: |
          mkdir dist
          git archive --format=zip --prefix="remote-ssh-${GITHUB_REF_NAME#v}/" -o "dist/remote-ssh-${GITHUB_REF_NAME#v}.zip" "$GITHUB_REF_NAME"
          (cd dist && sha256sum *.zip > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "remote-ssh $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
