name: Bug report
description: Something in remote-ssh does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. claude plugin install remote-ssh@remote-ssh
        2. /remote-ssh:remote-connect gpu-a
        3. ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `claude --version`, the plugin version, `ssh -V` and `sshfs --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Local OS
      options: [Linux, macOS, other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: The relevant lines from `/tmp/remote-ssh-<uid>/<session>/server.log`. Remove host names you do not want to share.
      render: text
