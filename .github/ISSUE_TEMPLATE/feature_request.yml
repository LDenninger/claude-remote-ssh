name: Feature request
description: Propose a new capability or a change in behaviour
title: "[feature] "
labels: [enhancement, triage]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I searched the open and closed issues for this request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The task you are trying to do and where remote-ssh gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other designs you thought about.
  - type: textarea
    id: overhead
    attributes:
      label: Cost in time and tokens
      description: remote-ssh keeps hooks at a few milliseconds and tool descriptions short. Note anything this would add per tool call, per prompt, or per session.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you open a pull request for this?
      options: ["Yes", "With guidance", "No"]
