name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Each job runs only once the code it checks exists, so the pipeline stays green on a bare branch.
  detect:
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.files.outputs.plugin }}
      unit: ${{ steps.files.outputs.unit }}
      integration: ${{ steps.files.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: files
        run: |
          echo "plugin=$([ -f .claude-plugin/plugin.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "unit=$([ -d tests/unit ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "integration=$([ -d tests/integration ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  versions:
    needs: detect
    if: needs.detect.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Version strings agree
        run: python .github/scripts/release_check.py

  validate:
    needs: detect
    if: needs.detect.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code@2.1.296
      - name: Validate marketplace
        run: claude plugin validate . --strict
      - name: Validate plugin manifest
        run: claude plugin validate .claude-plugin/plugin.json --strict

  # The Python, OpenSSH and sshfs each supported Ubuntu LTS ships, not versions picked by setup-python.
  ubuntu:
    needs: detect
    if: needs.detect.outputs.unit == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["22.04", "24.04", "26.04"]
    container:
      image: ubuntu:${{ matrix.release }}
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install distro packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 python3-pytest openssh-client openssh-server sshfs fuse3
          mkdir -p /run/sshd
          useradd --create-home tester
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Versions
        run: python3 --version && ssh -V && sshfs --version | head -1
      - name: Unit tests
        run: |
          chown -R tester .
          runuser -u tester -- python3 -m pytest tests/unit -q
      - name: Integration tests
        if: needs.detect.outputs.integration == 'true'
        run: runuser -u tester -- python3 -m pytest tests/integration -q

  macos:
    needs: detect
    if: needs.detect.outputs.unit == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        run: python -m pip install pytest==8.4.2
      - name: Unit tests
        run: python -m pytest tests/unit -q
